# Releases Herald. Started by hand from the Actions tab (see README, "Release it").
# verify: clean install, checks, pack, smoke test.  publish: tag + GitHub Release with the same package.
name: Release
run-name: Release${{ inputs.dry_run && ' (dry run)' || '' }}

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (check and pack, but publish nothing)
        type: boolean
        default: true

# No permissions unless a job asks for them.
permissions: {}

# One release at a time: a second run waits instead of running in parallel.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.pack.outputs.version }}
      commit: ${{ steps.pack.outputs.commit }}
      file: ${{ steps.pack.outputs.file }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - name: Check out the commit, with all tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Check the version is not released yet
        run: npm run release-guard

      - name: Install dependencies from the lockfile
        run: npm ci

      - name: Lint, type check, test and build
        run: npm run release-check

      - name: Pack and record what was packed
        id: pack
        run: |
          file="$(npm pack --silent)"
          version="$(node -p "require('./package.json').version")"
          commit="$(git rev-parse HEAD)"
          sha256="$(sha256sum "$file" | cut -d ' ' -f 1)"
          echo "$sha256  $file"
          {
            echo "file=$file"
            echo "version=$version"
            echo "commit=$commit"
            echo "sha256=$sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Install the package in an empty folder and run it
        env:
          FILE: ${{ steps.pack.outputs.file }}
        run: npm run smoke-test -- "$FILE"

      - name: Keep the package for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.pack.outputs.file }}
          archive: false
          if-no-files-found: error

  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      COMMIT: ${{ needs.verify.outputs.commit }}
      FILE: ${{ needs.verify.outputs.file }}
      SHA256: ${{ needs.verify.outputs.sha256 }}
    steps:
      - name: Download the package checked by verify
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.verify.outputs.file }}

      - name: Check it is the same file
        run: echo "$SHA256  $FILE" | sha256sum --check

      - name: Create the tag and the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "v$VERSION" "$FILE" \
            --target "$COMMIT" \
            --title "v$VERSION" \
            --notes "sha256 of $FILE: $SHA256"
